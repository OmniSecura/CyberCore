version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
#  CyberCore — Docker Compose
#
#  Quick start:
#    cp .env.example .env          # fill in secrets
#    docker compose up --build -d
#    docker compose logs -f        # tail all logs
#
#  Services and ports exposed on the host:
#    dashboard   → http://localhost:80       (nginx — SPA + API proxy)
#    auth        → http://localhost:8000     (FastAPI)
#    org         → http://localhost:8081     (FastAPI)
#    scan        → http://localhost:8082     (FastAPI)
#    log         → http://localhost:8083     (FastAPI — cyberlog ingest + dashboard)
#    db          → localhost:3306            (MySQL 8.0)
#    redis       → localhost:6379            (Redis 7)
#
#  Internal Docker network: cybercore_net
#    Services reach each other by name, e.g. http://auth:8000
# ══════════════════════════════════════════════════════════════════════════════

networks:
  cybercore_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  scan_workspace:   # shared between scan-service and scan-worker
  scan_uploads:     # uploaded zip files

# ── Reusable DB env fragment ──────────────────────────────────────────────────
x-db-env: &db-env
  DB_CONNECTOR: mysql
  MYSQL_HOST: db
  MYSQL_PORT: "3306"
  AUTH_USERNAME: ${AUTH_USERNAME:-root}
  AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme_app}

services:

  # ════════════════════════════════════════════════════════════════════════════
  #  Infrastructure
  # ════════════════════════════════════════════════════════════════════════════

  db:
    image: mysql:8.0
    restart: unless-stopped
    networks: [cybercore_net]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      # MYSQL_DATABASE is intentionally omitted — our init script creates
      # separate databases (auth_db, org_db, scan_db) for service isolation.
    volumes:
      - mysql_data:/var/lib/mysql
      # Init scripts run only on first start (empty data volume).
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"   # 3306 zajęty przez lokalny MySQL — Docker DB dostępny na 3307
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [cybercore_net]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"   # expose for local inspection (redis-cli, RedisInsight)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  #  Backend microservices
  # ════════════════════════════════════════════════════════════════════════════

  auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: auth_db
      # Redis DB 1 — separate from Celery to avoid key collisions
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CyberCore}
      APP_URL: ${APP_URL:-http://localhost}
      # CORS — dashboard container is named 'dashboard' and served on port 80
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      DB_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  org:
    build:
      context: ./services/organization-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: org_db
      AUTH_SERVICE_URL: http://auth:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      DB_CREATE_TABLES: "true"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CyberCore}
      APP_URL: ${APP_URL:-http://localhost}
      MAX_FREE_ORGS_PER_OWNER: ${MAX_FREE_ORGS_PER_OWNER:-3}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scan:
    build:
      context: ./services/scan-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: scan_db
      AUTH_SERVICE_URL: http://auth:8000
      ORG_SERVICE_URL: http://org:8081
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      DB_CREATE_TABLES: "true"
    volumes:
      - scan_uploads:/tmp/cybercore/uploads
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./workers/scan-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: scan_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SCAN_WORKSPACE_DIR: /tmp/cybercore/scans
      SCAN_UPLOAD_DIR: /tmp/cybercore/uploads
    volumes:
      - scan_workspace:/tmp/cybercore/scans
      - scan_uploads:/tmp/cybercore/uploads
    # No ports — Celery workers don't expose HTTP

  # ── DAST worker ─────────────────────────────────────────────────────────────
  # Separate worker process so DAST scans (single scan can pin a slot for 1 h)
  # never block the much shorter SAST queue. Same image as `worker`, different
  # CMD + queue.
  dast-worker:
    build:
      context: ./workers/scan-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      <<: *db-env
      MYSQL_DB: scan_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ZAP_HOST: zap
      ZAP_PORT: "8090"
      ZAP_API_KEY: ${ZAP_API_KEY:-cybercore-dev}
    command: >
      python -m celery -A src.celery_app:celery_app worker
      --loglevel=INFO
      --queues=dast
      --concurrency=1
      --hostname=dast-worker@%h

  # ── OWASP ZAP daemon ────────────────────────────────────────────────────────
  # The DAST engine. Runs headless in daemon mode exposing the REST API on
  # port 8090. We never publish the port to the host — only the dast-worker
  # talks to it over the internal `cybercore_net` network.
  #
  # The API key MUST be set in production. Default `cybercore-dev` is for
  # local development convenience only.
  zap:
    image: zaproxy/zap-stable
    restart: unless-stopped
    networks: [cybercore_net]
    user: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.key=${ZAP_API_KEY:-cybercore-dev}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=false
    # ZAP daemon takes 10–30 s to fully boot — the runner has its own retry
    # loop so we don't bother with a Compose healthcheck.

  # ── Log service ─────────────────────────────────────────────────────────────
  # Ingests logs from the `cyberlog` Python client, validates API keys
  # (cached in Redis DB 2), and pushes entries onto the `cyberlog:queue`
  # Redis list. The log-consumer drains that list into MySQL log_db.
  log:
    build:
      context: ./services/log-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: log_db
      # Redis DB 2 — separate from Celery (0) and auth blacklist (1).
      REDIS_URL: redis://redis:6379/2
      LOG_QUEUE_KEY: cyberlog:queue
      API_KEY_CACHE_TTL: "300"
      MAX_BATCH_SIZE: "500"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      DB_CREATE_TABLES: "true"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Log consumer ────────────────────────────────────────────────────────────
  # Long-running BRPOP loop on `cyberlog:queue`. Bulk-inserts logs into log_db.
  # Stateless: scale by spinning up replicas — each one will grab independent
  # entries off the list.
  log-consumer:
    build:
      context: ./workers/log-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      MYSQL_DB: log_db
      REDIS_URL: redis://redis:6379/2
      LOG_QUEUE_KEY: cyberlog:queue
      CONSUMER_BATCH_SIZE: "100"
      CONSUMER_BATCH_TIMEOUT: "1.0"
      BRPOP_TIMEOUT: "5"
      DB_CREATE_TABLES: "true"

  # ════════════════════════════════════════════════════════════════════════════
  #  Frontend
  # ════════════════════════════════════════════════════════════════════════════

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [cybercore_net]
    depends_on:
      auth:
        condition: service_healthy
      org:
        condition: service_healthy
      scan:
        condition: service_healthy
      log:
        condition: service_healthy
    ports:
      - "80:80"
