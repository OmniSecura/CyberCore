# CyberCore Dashboard — nginx site config
# Production: serves the Vite SPA and proxies /api/* to backend services.
# This replaces the Vite dev-server proxy (vite.config.js) for Docker deployments.

server {
    listen 80;
    server_name _;

    # ── Static assets ─────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for hashed asset files
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy — order matters (most-specific first) ───────────────────────

    # scan-service  :8082
    location /api/v1/scans {
        proxy_pass         http://scan:8082;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # scans can take a while
    }

    # organization-service  :8081  (invites endpoint comes before organizations
    #                               to avoid prefix ambiguity in some nginx versions)
    location /api/v1/invites {
        proxy_pass         http://org:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/organizations {
        proxy_pass         http://org:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # auth-service  :8000
    location /api/v1/users {
        proxy_pass         http://auth:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/email {
        proxy_pass         http://auth:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA fallback — all unknown paths return index.html ────────────────────
    # React Router handles client-side routing; nginx must not 404 on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;
    gzip_min_length 1024;
}
